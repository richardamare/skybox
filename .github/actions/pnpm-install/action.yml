name: pnpm install
description: Sets up the pnpm version pinned in package.json and installs from the frozen lockfile.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
